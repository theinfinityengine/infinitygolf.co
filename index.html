<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinity Golf · Coming Soon</title>
<style>
  :root{--paper:#eef6ec;--muted:#bcd3bd;--bg:#06170e;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--paper);-webkit-tap-highlight-color:transparent;position:relative}
  .backdrop{position:fixed;inset:0;z-index:0;
    background:radial-gradient(72% 55% at 50% -8%,rgba(244,207,95,.24),transparent 60%),
      radial-gradient(90% 70% at 50% 116%,rgba(20,70,40,.5),transparent 60%),
      linear-gradient(180deg,#12401f,#0a2a16 55%,#06170e 100%);}
  canvas{position:fixed;inset:0;z-index:1;display:block;touch-action:none}
  .vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(46% 40% at 50% 50%,rgba(6,23,14,.68),rgba(6,23,14,.32) 55%,transparent 72%);}
  .wrap{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 22px;}
  .logo{width:clamp(64px,9vw,92px);height:clamp(64px,9vw,92px);border-radius:24%;display:grid;place-items:center;
    background:linear-gradient(150deg,#2f9e63,#7bbf5f 50%,#e8c15a);box-shadow:0 14px 50px rgba(47,158,99,.4),inset 0 1px 2px rgba(255,255,255,.5);}
  .logo svg{width:60%;height:60%}
  .soon{margin:clamp(20px,3vh,32px) 0 clamp(24px,4vh,40px);font-size:clamp(11px,1.4vw,13px);letter-spacing:.4em;font-weight:700;text-transform:uppercase;
    color:#f0e2b0;padding:.6rem 1.3rem;border-radius:100px;border:1px solid rgba(244,207,95,.4);background:rgba(255,255,255,.04);}
  .wordmark{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:800;line-height:.9;letter-spacing:-.015em;font-size:clamp(52px,10vw,120px);text-transform:uppercase;}
  .wordmark .a{background:linear-gradient(180deg,#ffffff,#f3eccf);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .wordmark .b{background:linear-gradient(100deg,#f4cf5f,#8fce6a 55%,#3f9c63);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .tagline{margin-top:clamp(22px,3.2vh,34px);font-size:clamp(16px,2vw,22px);color:var(--muted);font-weight:400;}
  .inq{margin-top:clamp(30px,5vh,52px);font-size:clamp(12px,1.5vw,15px);color:#a9c0aa;font-weight:500;}
  .email{margin-top:.9rem;display:inline-block;text-decoration:none;font-weight:700;color:#fff;font-size:clamp(14px,1.8vw,18px);
    padding:.75rem 1.7rem;border-radius:100px;background:linear-gradient(100deg,#2f9e63,#e8c15a);box-shadow:0 10px 40px rgba(47,158,99,.45);transition:.2s;}
  .email:hover{filter:brightness(1.06);transform:translateY(-1px)}
</style>
</head>
<body>
  <div class="backdrop"></div>
  <canvas id="stage"></canvas>
  <div class="vignette"></div>
  <div class="wrap">
    <div class="logo"><svg viewBox="0 0 96 96" fill="none"><path d="M48 48 C48 33 26 33 26 48 C26 63 48 63 48 48 C48 33 70 33 70 48 C70 63 48 63 48 48 Z" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="soon">Coming soon</div>
    <div class="wordmark"><span class="a">Infinity</span><br><span class="b">Golf</span></div>
    <div class="tagline">Our site is on the way.</div>
    <div class="inq">For inquiries:</div>
    <a class="email" href="mailto:ash@infinityengine.ai">ash@infinityengine.ai</a>
  </div>
<script>
(() => {
  const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d');
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,DPR,dots=[];
  function makeDots(){dots=[];const N=Math.min(55,Math.floor(W*H/26000));
    for(let i=0;i<N;i++)dots.push({x:Math.random()*W,y:Math.random()*H*0.9,r:Math.random()*1.3+0.35,a:0.1+Math.random()*0.35,c:Math.random()<0.5?'#f4e4a8':'#bfe0a8'});}
  function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);makeDots();}
  resize();addEventListener('resize',resize);
  // golf ball sprite
  const BS=120;const ballCv=document.createElement('canvas');ballCv.width=ballCv.height=BS;const bcx=ballCv.getContext('2d');
  (function(){const cxp=60,cyp=60,R=52;const g=bcx.createRadialGradient(cxp-16,cyp-18,6,cxp,cyp,R);
    g.addColorStop(0,'#ffffff');g.addColorStop(.6,'#edf1ec');g.addColorStop(1,'#c7cec7');
    bcx.beginPath();bcx.arc(cxp,cyp,R,0,6.28);bcx.fillStyle=g;bcx.fill();
    bcx.save();bcx.beginPath();bcx.arc(cxp,cyp,R-3,0,6.28);bcx.clip();const sp=13;
    for(let y=cyp-R;y<cyp+R;y+=sp){const row=Math.round((y-cyp)/sp);const off=(row%2)?sp/2:0;
      for(let x=cxp-R;x<cxp+R;x+=sp){const dx=x+off;if(Math.hypot(dx-cxp,y-cyp)<R-4){bcx.beginPath();bcx.arc(dx,y,2.3,0,6.28);bcx.fillStyle='rgba(150,160,150,.4)';bcx.fill();}}}
    bcx.restore();bcx.beginPath();bcx.arc(cxp,cyp,R,0,6.28);bcx.lineWidth=2;bcx.strokeStyle='rgba(120,130,120,.22)';bcx.stroke();})();
  // gold coin sprite
  const CS=64;const coinCv=document.createElement('canvas');coinCv.width=coinCv.height=CS;const ccx=coinCv.getContext('2d');
  (function(){const g=ccx.createRadialGradient(24,22,6,32,32,30);g.addColorStop(0,'#fff2c0');g.addColorStop(.5,'#f4cf5f');g.addColorStop(1,'#b8862f');
    ccx.beginPath();ccx.arc(32,32,30,0,6.28);ccx.fillStyle=g;ccx.fill();ccx.lineWidth=2;ccx.strokeStyle='rgba(120,80,20,.5)';ccx.stroke();
    ccx.fillStyle='rgba(120,80,20,.85)';ccx.textAlign='center';ccx.textBaseline='middle';ccx.font='700 34px Georgia,serif';ccx.fillText('$',32,34);})();
  const parts=[];const MAX=reduced?26:60;
  function Part(x,y,vx,vy,s,coin){return{x,y,vx,vy,s,coin,ang:Math.random()*6.28,spin:(Math.random()-0.5)*0.12,a:0.9+Math.random()*0.1};}
  function spawn(p){if(parts.length>=MAX)parts.shift();parts.push(p);}
  function draw(p){ctx.save();ctx.globalAlpha=p.a;ctx.translate(p.x,p.y);ctx.rotate(p.ang);
    ctx.shadowColor=p.coin?'rgba(120,80,20,.35)':'rgba(0,0,0,.3)';ctx.shadowBlur=8;ctx.shadowOffsetY=4;
    ctx.drawImage(p.coin?coinCv:ballCv,-p.s/2,-p.s/2,p.s,p.s);ctx.restore();}
  let acc=0;const G=0.035;
  function frame(){ctx.clearRect(0,0,W,H);for(const d of dots){ctx.globalAlpha=d.a;ctx.fillStyle=d.c;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,6.28);ctx.fill();}ctx.globalAlpha=1;
    acc+=reduced?0.05:0.2;while(acc>=1){const coin=Math.random()<0.22;spawn(Part(Math.random()*W,-50,(Math.random()-0.5)*0.4,0.5+Math.random()*0.7,coin?24+Math.random()*10:26+Math.random()*20,coin));acc-=1;}
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=G;p.vy=Math.min(p.vy,2.6);p.x+=p.vx;p.y+=p.vy;p.ang+=p.spin;p.spin*=0.995;draw(p);if(p.y-60>H||p.x<-120||p.x>W+120)parts.splice(i,1);}
    requestAnimationFrame(frame);}
  frame();
  addEventListener('pointerdown',e=>{if(e.target.closest('a'))return;for(let i=0;i<6;i++){const a=Math.random()*Math.PI-Math.PI,sp=2+Math.random()*4;const coin=Math.random()<0.22;spawn(Part(e.clientX,e.clientY,Math.cos(a)*sp,Math.sin(a)*sp-2,coin?24+Math.random()*8:26+Math.random()*18,coin));}});
})();
</script>
</body>
</html>
